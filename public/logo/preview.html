<!doctype html>
<html lang="en-gb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambi4 logo preview</title>
<link rel="icon" href="ambi4-mark.svg" type="image/svg+xml">
<style>
  /* The rough logo's background, so screenshots compare like with like. */
  body { margin: 0; padding: 24px; background: #25231f; color: #b0a390; font: 13px/1.4 system-ui, sans-serif; }
  .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 32px; }
  figure { margin: 0; }
  figcaption { margin-top: 6px; }
  img { display: block; max-width: 100%; height: auto; }
</style>
</head>
<body>
<div class="row">
  <figure><img src="ambi4-logo.svg" width="512" height="512" alt="Ambi4"><figcaption>ambi4-logo.svg, 512 px</figcaption></figure>
  <figure><img src="ambi4-logo.svg" width="128" height="128" alt="Ambi4"><figcaption>128 px</figcaption></figure>
  <figure><img src="ambi4-logo.svg" width="32" height="32" alt="Ambi4"><figcaption>32 px</figcaption></figure>
  <figure><img src="ambi4-mark.svg" width="32" height="32" alt="Ambi4"><figcaption>ambi4-mark.svg (static favicon), 32 px</figcaption></figure>
</div>
</body>
</html>
