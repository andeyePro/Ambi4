name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          # SUBSTITUTE the repo name; must point at THIS repo's stamped copy
          # of the CLA, so the signed text is pinned in this repo's history.
          path-to-document: 'https://github.com/andeyePro/Ambi4/blob/main/CLA.md'
          branch: 'main'
          # SUBSTITUTE: comma-separated accounts exempt from signing
          # (bots and andeye Ltd's own accounts).
          allowlist: 'dependabot[bot],Aqueum'
